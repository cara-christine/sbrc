<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>SRBC Logo</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#1A1A1A;color:#F5F3EF;font-family:'DM Sans',system-ui,sans-serif;padding:40px 16px 64px}
main{max-width:1100px;margin:0 auto}
h1{font-weight:500;font-size:1rem;letter-spacing:.08em;text-transform:uppercase;margin:0 0 32px}
h2{font-weight:500;font-size:.8125rem;letter-spacing:.08em;text-transform:uppercase;color:#CFCBC6;margin:48px 0 14px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.tile{border-radius:4px;padding:32px;display:flex;align-items:center;justify-content:center;min-height:220px}
.tile img{max-width:100%;height:auto}
.dark{background:#0C0C0C}.light{background:#F5F3EF}
.small{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.small span{font-size:.75rem;color:#CFCBC6}
</style>
</head>
<body>
<main>
<h1>srbc logo</h1>

<h2>Logo</h2>
<div class="row">
<div class="tile dark"><img src="srbc-logo-dark.svg" alt="srbc logo, cream on black" width="480"></div>
<div class="tile light"><img src="srbc-logo-light.svg" alt="srbc logo, black on cream" width="480"></div>
</div>

<h2>Badge, for profile pictures and the browser tab</h2>
<div class="row">
<div class="tile dark"><img src="srbc-badge-dark.svg" alt="srbc badge, cream on black" width="220"></div>
<div class="tile light"><img src="srbc-badge-light.svg" alt="srbc badge, black on cream" width="220"></div>
</div>

<h2>Small sizes</h2>
<div class="tile dark small">
<img src="srbc-badge-dark.svg" alt="" width="32"><span>32px</span>
<img src="srbc-badge-dark.svg" alt="" width="64"><span>64px</span>
<img src="srbc-logo-dark.svg" alt="" width="160"><span>160px</span>
</div>
</main>
</body>
</html>
